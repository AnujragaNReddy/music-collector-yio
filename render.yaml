# Two services: a static React frontend, and a Python backend that handles
# the "Fetch files from URLs" feature (real HTTP downloads + disk writes that
# the browser-side Pyodide sandbox can't do). Deploy the backend first, copy
# its live URL, then set REACT_APP_API_URL on the frontend to that URL and
# redeploy it — Render assigns each service's URL only after its first
# deploy.
#
# API_KEY / REACT_APP_API_KEY: pick any random string and set the SAME value
# on both services. The backend is public with wide-open CORS, and /api/fetch
# makes the server request whatever URL it's given, so this key is what keeps
# it from being an open download relay for anyone who finds the URL.
#
# Free-tier web services spin down after inactivity, so the backend's first
# request after a while will be slow to wake up.
#
# GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET / GOOGLE_OAUTH_REFRESH_TOKEN
# / GOOGLE_DRIVE_ROOT_FOLDER_ID: optional — only needed for the Music
# Scraper's "Google Drive" destination option. Free-tier disk here is
# ephemeral (wiped on redeploy), so Drive is the durable choice. Uses OAuth
# delegation (writes against your own Drive quota), not a service account —
# service accounts have no storage quota of their own and can't create
# files even in a shared folder. See README.md for the one-time setup
# (run python-backend/get_drive_token.py locally once). Leave these unset
# and the feature just stays disabled in the UI — everything else works.
services:
  - type: web
    name: music-collector-backend
    runtime: python
    plan: free
    rootDir: python-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        sync: false

  - type: web
    name: music-collector
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: REACT_APP_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
